<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden — VITARO Home Gym</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f5efe6'/%3E%3Ctext x='50' y='69' font-size='58' font-family='Arial' font-weight='900' fill='%23181410' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<script>
  (function(){
    try{
      var stored = localStorage.getItem('vitaro-theme');
      var theme;
      if(stored === 'dark' || stored === 'light'){ theme = stored; }
      else { theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=39">
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a class="logo" href="index.html"><span class="logo-word">VITARO</span><span class="logo-sub"><span>HOME</span><span>GYMS</span></span></a>
      <div class="nav-panel nav-panel--static">
        <div class="nav-cta">
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Hell-/Dunkelmodus umschalten" title="Hell-/Dunkelmodus umschalten">
            <span class="icon-dark">&#9789;</span><span class="icon-light">&#9788;</span>
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="error-page">
    <div class="wrap">
      <div class="code">404</div>
      <span class="eyebrow">Seite nicht gefunden</span>
      <h1 style="margin:14px 0 16px;">Diese Seite hat den falschen Weg genommen.</h1>
      <p style="margin:0 auto 32px;max-width:420px;">Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
      <a href="index.html" class="btn btn-primary">Zur Startseite</a>
    </div>
  </section>
</main>

<script src="assets/js/main.js?v=6"></script>
<script src="assets/js/auth.js?v=4"></script>
</body>
</html>
